<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="text-xl font-bold text-blue-600 flex items-center gap-2">
            ⚽ Sports News
        </div>
        <button onclick="loadNews()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:bg-blue-700 transition cursor-pointer">
            🔄 Refresh
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-8 w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Sports News</h1>
            <p class="text-gray-600">Live daily sports headlines and updates.</p>
        </div>

        <div id="loading" class="text-center py-20 text-gray-600 text-lg">
            ⏳ Fetching sports headlines...
        </div>

        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 text-center py-4 text-gray-500 text-sm mt-auto">
        © 2026 Sports News Hub — All Rights Reserved.
    </footer>

    <script>
        const fallbackNews = [
            {
                title: "India Secures Heroic Victory in Thrilling Cricket Match",
                description: "An exceptional performance led by top-order batters sealed a memorable win in the final overs.",
                source: "Live Sports Wire",
                date: "Just now",
                imageUrl: "https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=600&auto=format&fit=crop",
                url: ""
            },
            {
                title: "Major Roster Changes Announced Ahead of Upcoming Season",
                description: "Head coaches confirm strategic changes to squad lineup for the upcoming regional tournament.",
                source: "Global Arena",
                date: "15 mins ago",
                imageUrl: "https://images.unsplash.com/photo-1517649763962-0c623266010b?w=600&auto=format&fit=crop",
                url: ""
            },
            {
                title: "Championship Highlights: Records Broken in High-Stakes Clash",
                description: "Athletes deliver unbelievable endurance displays breaking long-standing national timing records.",
                source: "Sports Desk",
                date: "1 hour ago",
                imageUrl: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&auto=format&fit=crop",
                url: ""
            }
        ];

        async function loadNews() {
            const grid = document.getElementById('news-grid');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            grid.innerHTML = '';

            let articles = [];

            // Primary source attempt: Inshorts Sports Feed
            try {
                const res = await fetch('https://inshortsapi.vercel.app/news?category=sports');
                if (res.ok) {
                    const data = await res.json();
                    if (data.data && data.data.length > 0) {
                        articles = data.data.map(a => ({
                            title: a.title,
                            description: a.content || a.decription,
                            source: a.author || "Inshorts",
                            date: a.date || "Recently",
                            imageUrl: a.imageUrl,
                            url: a.readMoreUrl || a.url || ""
                        }));
                    }
                }
            } catch (err) {
                console.warn("Primary API failed, attempting secondary API...");
            }

            // Secondary source attempt: Reddit Sports JSON API
            if (articles.length === 0) {
                try {
                    const res = await fetch('https://www.reddit.com/r/sports/hot.json?limit=9');
                    if (res.ok) {
                        const data = await res.json();
                        const posts = data.data?.children || [];
                        articles = posts.map(p => ({
                            title: p.data.title,
                            description: p.data.selftext || "Click below to read full discussion and news coverage.",
                            source: "r/sports",
                            date: "Live Feed",
                            imageUrl: (p.data.thumbnail && p.data.thumbnail.startsWith('http')) ? p.data.thumbnail : null,
                            url: `https://reddit.com${p.data.permalink}`
                        }));
                    }
                } catch (err) {
                    console.warn("Secondary API failed, fallback active.");
                }
            }

            // Final fallback
            if (articles.length === 0) {
                articles = fallbackNews;
            }

            loading.style.display = 'none';
            renderCards(articles);
        }

        function renderCards(articles) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            articles.forEach((a, i) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-sm flex flex-col hover:shadow-md transition';
                
                const badgeText = i === 0 ? '🏆 TOP STORY' : '🔥 HOT';
                const imageUrl = a.imageUrl || 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&auto=format&fit=crop';
                
                // Smart link handler: If valid URL exists, use it. Otherwise, search the title on Google.
                const targetUrl = (a.url && a.url !== '#' && a.url.startsWith('http')) 
                    ? a.url 
                    : `https://www.google.com/search?q=${encodeURIComponent(a.title)}`;

                card.innerHTML = `
                    <div class="relative h-48 bg-gray-200">
                        <span class="absolute top-3 left-3 bg-red-500 text-white px-3 py-1 text-xs font-bold rounded-full shadow">
                            ${badgeText}
                        </span>
                        <img src="${imageUrl}" alt="${a.title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&auto=format&fit=crop'">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex justify-between text-xs text-gray-500 mb-2">
                            <span>📍 ${a.source || "Sports Desk"}</span>
                            <span>⏱️ ${a.date || "Recently"}</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2 leading-snug">
                            ${a.title}
                        </h3>
                        <p class="text-sm text-gray-600 flex-grow mb-6 leading-relaxed">
                            ${a.description || 'No detailed description available.'}
                        </p>
                        <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="block w-full py-3 bg-blue-600 text-white rounded-xl font-semibold text-center hover:bg-blue-700 transition">
                            Read Full Story ➔
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadNews();
    </script>
</body>
</html>
